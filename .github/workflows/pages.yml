# Builds the site from README.md and README_zh.md.
# Pull requests: fail if the two READMEs list different links.
# main: rebuild and deploy to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - README_zh.md
      - site/**
      - scripts/build_site.py
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - README_zh.md
      - site/**
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: python3 scripts/build_site.py ${{ github.event_name == 'pull_request' && '--strict' || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
