<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome Decision Models</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="Awesome Decision Models">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="stylesheet" href="style.css">
<script>
  // Pick the language before first paint: ?lang= > saved choice > browser.
  (function () {
    var q = new URLSearchParams(location.search).get("lang");
    var saved = null;
    try { saved = localStorage.getItem("lang"); } catch (e) {}
    var lang = q || saved || (/^zh/i.test(navigator.language) ? "zh" : "en");
    if (lang !== "zh") lang = "en";
    document.documentElement.dataset.lang = lang;
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  })();
</script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#">Awesome Decision Models</a>
    <div class="top-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-set-lang="en">EN</button>
        <button type="button" data-set-lang="zh">中文</button>
      </div>
      <a class="gh" href="https://github.com/{{REPO}}" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="toc" aria-label="Sections">
    <ul>{{TOC}}</ul>
  </nav>

  <main>
    <section class="hero">
      <h1>Awesome Decision Models</h1>
      {{TAGLINE}}
      <div class="intro">{{INTRO}}</div>
      <div class="search-row">
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               data-placeholder-en="Search {{TOTAL}} entries (press /)"
               data-placeholder-zh="搜索 {{TOTAL}} 个条目（按 / 键）">
        <span class="search-status" id="search-status" aria-live="polite"></span>
      </div>
    </section>

    {{SECTIONS}}

    <p class="empty" id="empty" hidden>
      <span class="l-en" lang="en">Nothing matches. Know a project that should be here? <a href="https://github.com/{{REPO}}/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">Add it</a>.</span>
      <span class="l-zh" lang="zh-CN">没有匹配的条目。知道应该收录的项目？<a href="https://github.com/{{REPO}}/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">提交一个</a>。</span>
    </p>

    <footer class="footer">
      {{FOOTER}}
      <p class="build">
        <span class="l-en" lang="en">Generated from <a href="https://github.com/{{REPO}}/blob/main/README.md" target="_blank" rel="noopener">README.md</a> and <a href="https://github.com/{{REPO}}/blob/main/README_zh.md" target="_blank" rel="noopener">README_zh.md</a></span>
        <span class="l-zh" lang="zh-CN">由 <a href="https://github.com/{{REPO}}/blob/main/README_zh.md" target="_blank" rel="noopener">README_zh.md</a> 和 <a href="https://github.com/{{REPO}}/blob/main/README.md" target="_blank" rel="noopener">README.md</a> 生成</span>
        · <a href="https://github.com/{{REPO}}/commit/{{SHA}}" target="_blank" rel="noopener"><code>{{SHORT_SHA}}</code></a> · {{DATE}}
      </p>
    </footer>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
